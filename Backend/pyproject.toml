[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.12.0",
    "dotenv>=0.9.9",
    "fastapi>=0.136.3",
    "google-genai>=2.8.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pytest>=9.0.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

# Build-only tools. PyInstaller packages the backend and the production
# frontend into ClosetAI.exe (see ../packaging and ../build_windows.ps1).
[dependency-groups]
dev = [
    "pyinstaller>=6.11",
]

